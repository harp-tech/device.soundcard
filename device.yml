%YAML 1.1
---
# yaml-language-server: $schema=https://harp-tech.org/draft-02/schema/device.json
device: SoundCard
whoAmI: 1280
firmwareVersion: "3.0"
hardwareTargets: "2.2"
registers:
  Start:
    address: 32
    type: U16
    access: [Write, Event]
    minValue: 2
    maxValue: 40000
    defaultValue: 2
    description: Starts the sound index if the value is less than 32, or otherwise the waveform generator at the specified frequency in Hz.
  Stop:
    address: 33
    type: U8
    access: [Write, Event]
    description: Stops the sound or frequency being played when the written value is non-zero.
  AttenuationLeft: &attenuation
    address: 34
    type: U16
    access: Write
    description: Specifies the attenuation for the left channel (1 LSB is 0.1dB).
  AttenuationRight:
    <<: *attenuation
    address: 35
    description: Specifies the attenuation for the right channel (1 LSB is 0.1dB).
  AttenuationBoth:
    <<: *attenuation
    address: 36
    length: 2
    description: Specifies the attenuation for the left and right channels simultaneously [Att L] [Att R] (1 LSB is 0.1dB).
  AttenuationStart:
    <<: *attenuation
    address: 37
    length: 3
    description: Specifies attenuation and simultaneously starts the sound index or frequency [Index] [Att L] [Att R].
  DeleteSound:
    address: 38
    type: U8
    access: Write
    minValue: 2
    maxValue: 31
    defaultValue: 2
    description: Deletes the sound stored at the specified index.
  DeleteAllSounds:
    address: 39
    type: U8
    access: Write
    description: Deletes all sounds stored in the device when the written value is non-zero.
  InputState:
    address: 40
    type: U8
    access: Event
    maskType: DigitalInputs
    description: Reports the state of the digital inputs. Events are sent only for inputs configured in Digital mode.
  ConfigureDI0: &configureDI
    address: 41
    type: U8
    access: Write
    maskType: DIMode
    description: Specifies the operation mode of the digital input 0 (DI0).
  ConfigureDI1:
    <<: *configureDI
    address: 42
    description: Specifies the operation mode of the digital input 1 (DI1).
  StartOnDI0: &soundIndex
    address: 43
    type: U16
    access: Write
    minValue: 2
    maxValue: 40000
    defaultValue: 2000
    description: Specifies the sound index or frequency to start when triggering DI0, following the same rules as Start.
  StartOnDI1:
    <<: *soundIndex
    address: 44
    defaultValue: 4000
    description: Specifies the sound index or frequency to start when triggering DI1, following the same rules as Start.
  AttenuationLeftDI0:
    <<: *attenuation
    address: 45
    defaultValue: 60
    description: Specifies the attenuation to set on the left channel (1 LSB is 0.1dB) when triggering DI0.
  AttenuationLeftDI1:
    <<: *attenuation
    address: 46
    defaultValue: 60
    description: Specifies the attenuation to set on the left channel (1 LSB is 0.1dB) when triggering DI1.
  AttenuationRightDI0:
    <<: *attenuation
    address: 47
    defaultValue: 60
    description: Specifies the attenuation to set on the right channel (1 LSB is 0.1dB) when triggering DI0.
  AttenuationRightDI1:
    <<: *attenuation
    address: 48
    defaultValue: 60
    description: Specifies the attenuation to set on the right channel (1 LSB is 0.1dB) when triggering DI1.
  Reserved2: &reserved
    address: 49
    type: U8
    access: Read
    description: Reserved for future use.
    visibility: private
  Reserved3:
    <<: *reserved
    address: 50
  Reserved4:
    <<: *reserved
    address: 51
  ConfigureDO0: &configureDO
    address: 52
    type: U8
    access: Write
    maskType: DOMode
    defaultValue: 1
    description: Specifies the operation mode of the digital output 0 (DO0).
  ConfigureDO1:
    <<: *configureDO
    address: 53
    defaultValue: 0
    description: Specifies the operation mode of the digital output 1 (DO1).
  ConfigureDO2:
    <<: *configureDO
    address: 54
    defaultValue: 0
    description: Specifies the operation mode of the digital output 2 (DO2).
  Reserved5:
    <<: *reserved
    address: 55
  Reserved6:
    <<: *reserved
    address: 56
  Reserved7:
    <<: *reserved
    address: 57
  OutputSet: &output
    address: 58
    type: U8
    access: Write
    maskType: DigitalOutputs
    description: Sets the specified digital output lines.
  OutputClear:
    <<: *output
    address: 59
    description: Clears the specified digital output lines.
  OutputToggle:
    <<: *output
    address: 60
    description: Toggles the specified digital output lines.
  OutputState:
    <<: *output
    address: 61
    description: Writes the state of all digital output lines.
  Reserved8:
    <<: *reserved
    address: 62
  Reserved9:
    <<: *reserved
    address: 63
  EnableAdcControlState:
    address: 64
    type: U8
    access: Write
    maskType: EnableFlag
    description: Specifies whether the ADC control state is reported, sampled at 1 kHz.
  AdcControlState:
    address: 65
    type: U16
    access: Event
    length: 5
    description: Reports sampled analog input data and current sound parameters.
    payloadSpec:
      Adc0:
        offset: 0
        description: The sampled analog input value on ADC0.
      Adc1:
        offset: 1
        description: The sampled analog input value on ADC1.
      AttenuationLeft:
        offset: 2
        description: The last attenuation of the left channel set by a register write.
      AttenuationRight:
        offset: 3
        description: The last attenuation of the right channel set by a register write.
      Frequency:
        offset: 4
        description: The last sound index or frequency set by a register write, following the same rules as Start.
  ConfigureAdc0: &configureAdc
    address: 66
    type: U8
    access: Write
    maskType: AdcMode
    visibility: private
    description: Specifies the operation mode of analog input ADC0 (not implemented yet).
  ConfigureAdc1:
    <<: *configureAdc
    address: 67
    description: Specifies the operation mode of analog input ADC1 (not implemented yet).
  Reserved10:
    <<: *reserved
    address: 68
  Reserved11:
    <<: *reserved
    address: 69
  Reserved12:
    <<: *reserved
    address: 70
  Reserved13:
    <<: *reserved
    address: 71
  Reserved14:
    <<: *reserved
    address: 72
  Reserved15:
    <<: *reserved
    address: 73
  Reserved16:
    <<: *reserved
    address: 74
  Reserved17:
    <<: *reserved
    address: 75
  Reserved18:
    <<: *reserved
    address: 76
  Reserved19:
    <<: *reserved
    address: 77
  Reserved20:
    <<: *reserved
    address: 78
  Reserved21:
    <<: *reserved
    address: 79
  Reserved22:
    <<: *reserved
    address: 80
  Reserved23:
    <<: *reserved
    address: 81
  Pic32Bootloader:
    address: 82
    type: U8
    access: Write
    maskType: EnableFlag
    visibility: private
    description: Specifies whether the PIC32 micro-controller bootloader is enabled. While enabled, the serial port is connected to the PIC32 bootloader.
bitMasks:
  DigitalInputs:
    description: Specifies the state of the digital input lines.
    bits:
      DI0: {value: 1, description: Digital input 0.}
      DI1: {value: 2, description: Digital input 1.}
      DI2: {value: 4, description: Digital input 2 (no associated event).}
  DigitalOutputs:
    description: Specifies the state of the digital output lines.
    bits:
      DO0: {value: 1, description: Digital output 0.}
      DO1: {value: 2, description: Digital output 1.}
      DO2: {value: 4, description: Digital output 2.}
groupMasks:
  DIMode:
    description: Specifies the operation mode of a digital input.
    values:
      Digital: {value: 0, description: Used as a pure digital input.}
      StartAndStop: {value: 1, description: Starts sound index (if less than 32) or frequency (if greater or equal than 32) on a rising edge and stops it on a falling edge.}
      Start: {value: 2, description: Starts sound index (if less than 32) or frequency (if greater or equal than 32) on a rising edge.}
      Stop: {value: 3, description: Stops the sound or frequency being played on a rising edge.}
  DOMode:
    description: Specifies the operation mode of a digital output.
    values:
      Digital: {value: 0, description: Used as a pure digital output.}
      PulseOnStart: {value: 1, description: Positive 400us pulse when a sound or frequency starts. }
  AdcMode:
    description: Specifies the operation mode of an analog input.
    values:
      AnalogInput: {value: 0, description: Used as a pure analog input.}
      Attenuation: {value: 1, description: Controls the attenuation of the left channel from ADC0 and of the right channel from ADC1.}
      AttenuationBoth: {value: 2, description: Controls the attenuation of both channels.}
      Frequency: {value: 3, description: Controls the frequency of the waveform generator from ADC1 only.}
